[project]
name = "mama-analysis"
version = "0.1.0"
description = "Analysis pipeline for the mama health chatbot conversation challenge"
authors = [
    { name = "NeilSinclair", email = "neil.ian.sinclair@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11",
    "matplotlib>=3.11.2",
    "openai>=3.20.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
mama-pipeline = "mama_analysis.cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
