<!doctype html>
<!-- data-theme="light" locks the page to the light palette whatever the reader's system setting. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Field colours match the explorer (validated in D-036); disease uses its neutral. */
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e6e3de; --accent: #b4532a; --accent-soft: #fbeee7; --chip: #f3f1ed; --code-bg: #f3f1ed; --user-bubble: #fbeee7; --bot-bubble: #f3f1ed;
    --reason: #a8408f; --topic: #3867b5; --end: #1f7a4d; --neutral: #6b7a8c; --pain: #c2412d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --surface: #1c1c1e; --text: #ececec; --muted: #a0a0a6;
      --border: #2e2e31; --accent: #ec8a5c; --accent-soft: #2e1f18; --chip: #26262a; --code-bg: #26262a; --user-bubble: #2e1f18; --bot-bubble: #26262a;
      --reason: #c064bc; --topic: #5f8ce0; --end: #34a595; --neutral: #8b95a3; --pain: #dd6e58;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --surface: #1c1c1e; --text: #ececec; --muted: #a0a0a6;
    --border: #2e2e31; --accent: #ec8a5c; --accent-soft: #2e1f18; --chip: #26262a; --code-bg: #26262a; --user-bubble: #2e1f18; --bot-bubble: #26262a;
    --reason: #c064bc; --topic: #5f8ce0; --end: #34a595; --neutral: #8b95a3; --pain: #dd6e58;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 48px 16px 80px; }
  /* Contents list: above the text by default (narrow windows, and browsers without :has). */
  nav.contents { max-width: 820px; margin: 0 auto; padding: 32px 16px 0; font-size: 13.5px; }
  nav.contents + main { padding-top: 24px; }
  nav.contents p { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px 12px; }
  nav.contents ul { list-style: none; margin: 0; padding: 0; }
  nav.contents ul ul { padding-left: 12px; }
  nav.contents li { margin: 0; }
  nav.contents a { display: block; padding: 4px 10px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; line-height: 1.35; }
  nav.contents a:hover { color: var(--text); }
  nav.contents a[aria-current] { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  /* Wide windows: the list sits at the left edge and stays in view, with the text centred in
     the window (equal side columns; the right one gives way first as the window narrows). */
  @media (min-width: 1101px) {
    @supports selector(:has(a)) {
      .page:has(nav.contents) { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 820px) minmax(0, 1fr); }
      nav.contents + main { width: 100%; padding-top: 48px; }
      nav.contents { width: 220px; max-width: none; margin: 0; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 60px 0 24px 16px; }
    }
  }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -.01em; }
  h2 { font-size: 21px; margin: 44px 0 12px; padding-top: 20px; border-top: 1px solid var(--border); letter-spacing: -.005em; }
  h3 { font-size: 17px; margin: 28px 0 8px; }
  code { font: 13.5px "JetBrains Mono", ui-monospace, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  ul, ol { padding-left: 22px; } li { margin: 4px 0; }
  figure { margin: 18px 0 24px; }
  figcaption { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  thead th { color: var(--muted); font-weight: 600; font-size: 13px; }
  tbody th { font-weight: 500; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  tr.all th, tr.all td { font-weight: 600; border-top: 2px solid var(--border); }
  .num { text-align: right; }
  /* Sortable tables: headers are buttons; the arrow shows the current order. */
  table.sortable thead th { padding: 0; }
  table.sortable thead button { font: inherit; color: inherit; background: none; border: 0; width: 100%; padding: 8px 12px; text-align: inherit; cursor: pointer; white-space: nowrap; }
  table.sortable thead button:hover, table.sortable thead button:focus-visible { color: var(--text); }
  table.sortable thead th[aria-sort] button { color: var(--text); }
  table.sortable thead button::after { content: " ↕"; opacity: .35; }
  table.sortable thead th[aria-sort="ascending"] button::after { content: " ↑"; opacity: 1; }
  table.sortable thead th[aria-sort="descending"] button::after { content: " ↓"; opacity: 1; }

  /* Pain-point list: a dropdown picks which "where" column shows. */
  .rowpick { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .rowpick select { font: inherit; font-weight: 400; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .pain-fig[data-rows="topic_group"] [data-field="disease"],
  .pain-fig[data-rows="disease"] [data-field="topic_group"] { display: none; }
  .pain-table { font-size: 14px; }
  .pain-table td, .pain-table tbody th { vertical-align: top; }
  .pain-table tbody th { white-space: nowrap; }
  .pain-table .ids { color: var(--muted); font-size: 13px; min-width: 130px; }
  .wchip { display: inline-block; background: var(--chip); border-radius: 99px; padding: 1px 9px; margin: 1px 2px 1px 0; font-size: 13px; white-space: nowrap; }
  .wchip b { font-weight: 700; }

  /* Collapsible sections written in the draft as <details markdown="1"><summary>…</summary>. */
  main > details { margin: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 0; }
  main > details > summary { cursor: pointer; font-weight: 600; font-size: 17px; padding: 10px 0; }
  main > details > summary:hover { color: var(--accent); }
  main > details[open] > summary { margin-bottom: 4px; }
  main > details + details { border-top: 0; margin-top: -16px; }

  /* Linked counts: the explorer's Breakdown tab, restricted to the memo's fields. */
  .breakdown { margin: 18px 0 24px; }
  .bcontrols { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .bcontrols .bcount { font-weight: 600; }
  .bcontrols .bsel { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; background: var(--accent-soft); color: var(--text); border: 1px solid transparent; border-radius: 99px; padding: 2px 10px; cursor: pointer; }
  .bcontrols .bclear { margin-left: auto; font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .bhint { color: var(--muted); font-size: 13.5px; margin: 8px 0 12px; }
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 8px; }
  /* About five rows show; the rest scroll inside the card. */
  .prows { max-height: 152px; overflow-y: auto; overscroll-behavior: contain; }
  .pmore { color: var(--muted); font-size: 12px; margin: 4px 4px 0; }
  .panel h3 { margin: 0 0 6px 4px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .brow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 26px; gap: 8px; align-items: center; width: 100%; font: inherit; font-size: 13px; text-align: left; color: var(--text); background: none; border: 0; border-radius: 6px; padding: 4px; cursor: pointer; }
  .brow:hover, .brow:focus-visible { background: var(--chip); }
  .brow.on { background: var(--accent-soft); font-weight: 600; }
  .brow .lab { overflow-wrap: anywhere; }
  .brow .fill { display: block; height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .brow .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bdetails { margin-top: 14px; }
  .bdetails > summary { cursor: pointer; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  /* Each matching conversation opens to its full summary and transcript. */
  .blist details > summary { cursor: pointer; list-style-position: outside; }
  .blist details > summary:hover .sid { color: var(--accent); }
  .blist .full { margin: 10px 0 4px; }
  .blist details[open] > summary .first { display: none; }
  .convo { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 4px; }
  .bubble { max-width: 82%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; font-size: 14px; }
  .bubble.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .bubble .who { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
  .blist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .blist li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin: 0; }
  .blist .sid { font-weight: 700; margin-right: 8px; }
  .blist .tag { color: var(--muted); font-size: 12px; margin-right: 8px; }
</style>
</head>
<body>
<div class="page">
<!--__TOC__-->
<main>
<!--__BODY__-->
</main>
</div>
<script>
const DATA = /*__PAYLOAD__*/null;
const FIELDS = {
  reason_for_conversation: ["Reason for conversation", "reason"],
  topic_group: ["Topic group (strong)", "topic"],
  conversation_pain_points: ["Conversation pain point", "pain"],
  end_reason: ["End reason", "end"],
  disease: ["Disease", "neutral"],
};
const NONE = "(none)";
const PANEL_ROWS = 5;  // rows visible before a card scrolls (see .prows)
const state = { selected: [] };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

// A conversation's labels for one field; "(none)" when it has none (e.g. no strong topic).
// Pain points get no "(none)" row: a conversation without one is just not counted there.
function vals(row, key) {
  return row[key].length || key === "conversation_pain_points" ? row[key] : [NONE];
}

function isSelected(key, label) {
  return state.selected.some(([k, l]) => k === key && l === label);
}

function toggle(key, label) {
  state.selected = isSelected(key, label)
    ? state.selected.filter(([k, l]) => !(k === key && l === label))
    : [...state.selected, [key, label]];
  render();
}

function render() {
  const grid = document.getElementById("bgrid");
  if (!grid || !DATA) return;
  const rows = DATA.rows.filter((r) => state.selected.every(([k, l]) => vals(r, k).includes(l)));
  const n = rows.length;

  document.getElementById("bcontrols").replaceChildren(
    el("span", { class: "bcount" }, `${n} of ${DATA.rows.length} conversations`),
    el("span", { class: "bsel" }, ...state.selected.map(([k, l]) => el("button", {
      type: "button", class: "chip", title: "Remove", onclick: () => toggle(k, l),
    }, `${FIELDS[k][0]}: ${l} ×`))),
    el("button", { type: "button", class: "bclear", onclick: () => { state.selected = []; render(); } }, "Clear"),
  );

  grid.replaceChildren(...DATA.fields.map((key) => {
    const [name, cls] = FIELDS[key];
    const counts = new Map();
    for (const r of rows) for (const lab of new Set(vals(r, key))) counts.set(lab, (counts.get(lab) || 0) + 1);
    const items = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const panel = el("div", { class: "panel" },
      el("h3", {}, el("span", { class: "swatch", style: `background: var(--${cls})` }), name),
      el("div", { class: "prows" }, ...items.map(([lab, c]) => {
        const on = isSelected(key, lab);
        return el("button", {
          type: "button", class: `brow${on ? " on" : ""}`, "aria-pressed": String(on),
          title: `${lab}: ${c} of ${n} conversations`,
          onclick: () => toggle(key, lab),
        },
          el("span", { class: "lab" }, `${on ? "✓ " : ""}${lab}`),
          el("span", { class: "track" }, el("span", { class: "fill", style: `width: ${(100 * c) / n}%; background: var(--${cls})` })),
          el("span", { class: "n" }, String(c)));
      })));
    if (items.length > PANEL_ROWS) panel.append(el("p", { class: "pmore" }, `${items.length} labels; scroll for more`));
    return panel;
  }));

  document.getElementById("bhead").textContent = `Matching conversations (${n}) · click one to read it`;
  document.getElementById("blist").replaceChildren(...rows.map((r) => el("li", {}, conversationItem(r))));
}

// A matching conversation: one line, opening to the full summary and transcript (built on first open).
function conversationItem(r) {
  const item = el("details", {},
    el("summary", {},
      el("span", { class: "sid" }, r.session_id),
      el("span", { class: "tag" }, `${r.disease.join(", ")} · ${r.end_reason.join(", ")}`),
      el("span", { class: "first" }, r.summary.split(/(?<=[.!?])\s/)[0])));
  item.addEventListener("toggle", () => {
    if (!item.open || item.dataset.loaded) return;
    item.dataset.loaded = "1";
    const bubbles = DATA.conversations[r.session_id].map((t) => el("div", { class: `bubble ${t.role}` },
      el("span", { class: "who" }, `t${t.turn} · ${t.role}`), t.text));
    item.append(el("p", { class: "full" }, el("strong", {}, "Summary (LLM): "), r.summary), el("div", { class: "convo" }, ...bubbles));
  });
  return item;
}

render();

// Click a column header to sort its table; numbers sort high to low first, text A to Z first.
// Click again to reverse. The "All" row stays last.
function makeSortable(table) {
  const heads = [...table.tHead.rows[0].cells];
  const body = table.tBodies[0];
  const key = (tr, i) => {
    const text = tr.cells[i].textContent.trim();
    const n = parseFloat(text.replace("%", ""));
    return Number.isNaN(n) ? text.toLowerCase() : n;
  };
  heads.forEach((th, i) => {
    const button = el("button", { type: "button" }, ...th.childNodes);
    th.replaceChildren(button);
    button.addEventListener("click", () => {
      const rows = [...body.rows].filter((tr) => !tr.classList.contains("all"));
      const numeric = rows.every((tr) => typeof key(tr, i) === "number");
      const current = th.getAttribute("aria-sort");
      const dir = current ? (current === "ascending" ? "descending" : "ascending") : (numeric ? "descending" : "ascending");
      const sign = dir === "ascending" ? 1 : -1;
      rows.sort((a, b) => {
        const x = key(a, i), y = key(b, i);
        return sign * (x < y ? -1 : x > y ? 1 : 0) || key(a, 0).localeCompare(key(b, 0));
      });
      for (const h of heads) h.removeAttribute("aria-sort");
      th.setAttribute("aria-sort", dir);
      const all = [...body.rows].filter((tr) => tr.classList.contains("all"));
      body.replaceChildren(...rows, ...all);
    });
  });
}
document.querySelectorAll("table.sortable").forEach(makeSortable);

// Contents list: mark the section being read. That is the last heading to have reached the top
// of the window (so a clicked link marks its own section, not the sub-section right under it),
// or the last heading once the page has been scrolled to its end.
const tocLinks = [...document.querySelectorAll("nav.contents a")];
const tocHeads = tocLinks.map((a) => document.getElementById(decodeURIComponent(a.hash.slice(1))));
function markCurrent() {
  let current = -1;
  tocHeads.forEach((h, i) => { if (h.getBoundingClientRect().top <= 60) current = i; });
  const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  if (window.scrollY > 0 && atEnd) current = tocLinks.length - 1;
  tocLinks.forEach((a, i) => {
    if (i === current) a.setAttribute("aria-current", "true");
    else a.removeAttribute("aria-current");
  });
}
if (tocLinks.length) {
  window.addEventListener("scroll", markCurrent, { passive: true });
  window.addEventListener("resize", markCurrent);
  markCurrent();
}

// The pain-point list's dropdown picks which "where" column shows.
const painRows = document.getElementById("pain-rows");
if (painRows) {
  painRows.addEventListener("change", () => {
    painRows.closest(".pain-fig").dataset.rows = painRows.value;
  });
}
</script>
</body>
</html>
